</script><canvas aria-hidden="true" id="sakura-rain"></canvas><script>
(()=>{
 const canvas=document.getElementById('sakura-rain');
 if(!canvas||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,petals=[],settled=[],last=0,raf=0,scrollY=window.scrollY;
 const rnd=(a,b)=>a+Math.random()*(b-a);
 function resize(){w=window.innerWidth;h=window.innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);settled=[];petals=[];for(let i=0;i<Math.min(32,Math.max(14,Math.round(w/32)));i++)spawn(true)}
 function spawn(randomY=false){petals.push({x:rnd(0,w),y:randomY?rnd(-h,0):rnd(-90,-12),r:rnd(3.2,6.8),vy:rnd(.45,1.2),vx:rnd(-.25,.3),phase:rnd(0,6.28),spin:rnd(.005,.025),a:rnd(.35,.75)})}
 function drawPetal(p,t){ctx.save();ctx.translate(p.x+Math.sin(t*.0008+p.phase)*12,p.y);ctx.rotate(Math.sin(t*p.spin*.04+p.phase)*.55);ctx.globalAlpha=p.a;ctx.fillStyle='#df879d';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-p.r,-p.r*.65,-p.r*.9,-p.r*1.8,0,-p.r*1.6);ctx.bezierCurveTo(p.r*.9,-p.r*1.8,p.r,-p.r*.65,0,0);ctx.fill();ctx.restore()}
 function frame(t){if(!last)last=t;const dt=Math.min((t-last)/16.67,2);last=t;ctx.clearRect(0,0,w,h);
 for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.y+=p.vy*dt;p.x+=p.vx*dt;drawPetal(p,t);if(p.y>=h-p.r*1.1){if(settled.length<Math.min(95,Math.round(w/6)))settled.push({...p,y:h-rnd(0,13),a:p.a*.72});petals.splice(i,1);spawn()}}
 for(const p of settled)drawPetal(p,t);
 raf=requestAnimationFrame(frame)}
 let scrollScheduled=false;
 window.addEventListener('scroll',()=>{if(scrollScheduled)return;scrollScheduled=true;requestAnimationFrame(()=>{scrollScheduled=false;if(Math.abs(window.scrollY-scrollY)>5){scrollY=window.scrollY;settled=[];petals=[];for(let i=0;i<Math.min(32,Math.max(14,Math.round(w/32)));i++)spawn(true)}})},{passive:true});

})();
